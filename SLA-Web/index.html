<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Software Training Institute in Chennai</title>

<body>
    <nav>
        <div class="brand-box">
            <img src="https://www.slainstitute.com/wp-content/uploads/2025/08/SLANewLogo.webp" alt="Brand Logo">
        </div>
        <div class="search-box">
            <input type="text">

        </div>
        <div class="menu-box">
            <ul>
                <li><a href="#">Courses</a><i class="fa-solid fa-circle-chevron-down"></i></li>

                <li><a href="#">Book a demo class</a></li>
            </ul>
        </div>

    <article class="hero-box">
        <div class="hero-img">
            <img src="https://www.slainstitute.com/wp-content/uploads/2024/06/GirlPostiveReviewShape.webp" alt="hero image">
        </div>
        <div class="hero-content">
            <h4>Discover <span>Right</span> Learning</h4>
            <h2>Get Job Ready with</h2>
